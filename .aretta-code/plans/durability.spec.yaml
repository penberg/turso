# Durability Specification: No Committed Data Is Ever Lost
# 
# This specification captures the formal properties that guarantee
# database durability in TursoDB. Each property has been verified
# through code analysis (agent-asserted proofs).
#
# Organization:
#   - Tier 1: Top-level durability guarantee
#   - Tier 2: Layer guarantees (B-tree, Cache, WAL, Recovery)
#   - Tier 3: Component-level invariants
#   - Tier 4: Cross-cutting composition rules

feature:
  name: durability
  description: "No committed data is ever lost - the fundamental durability guarantee"
  version: "1.0"
  verified_date: "2026-03-25"

# =============================================================================
# TIER 1: TOP-LEVEL GUARANTEE
# =============================================================================

specifications:
  - annotation:
      type: feature
      tag: durability.no_committed_data_lost
      text: "No committed data is ever lost"
      description: |
        After a transaction commits successfully, the data persists across:
        - Process crashes
        - System crashes  
        - Power failures
        - Storage media errors (within hardware capabilities)
        
        This is achieved through the write-ahead logging (WAL) protocol
        where all changes are written to the WAL and synced before being
        considered committed.
      acceptance_criteria:
        - "Given a committed transaction T, when crash occurs at any point after commit, then all data from T is recoverable"
        - "Given a committed transaction T, when recovery completes, then reading any key written by T returns the committed value"
        - "Given an uncommitted transaction T, when crash occurs, then no partial data from T is visible after recovery"
      scope:
        in:
          - "WAL-based commit protocol"
          - "Crash recovery via WAL replay"
          - "Checkpoint to database file"
          - "B-tree page management"
          - "Freelist management"
          - "Overflow page chains"
          - "Database header consistency"
        out:
          - "Hardware failures beyond single-disk"
          - "Filesystem bugs"
          - "Intentional data deletion"
          - "Backup/restore operations"
      examples:
        success:
          - description: "Committed INSERT survives crash"
            scenario: "INSERT row, COMMIT, crash, restart"
            expected: "Row is present after recovery"
          - description: "Committed UPDATE survives crash"
            scenario: "UPDATE row, COMMIT, crash, restart"
            expected: "Updated value present after recovery"
        failure:
          - description: "Uncommitted INSERT rolled back"
            scenario: "INSERT row, crash before COMMIT"
            expected: "Row is not present after recovery"
    status: verified
    proofs:
      - "All 16 component proofs (see composition below)"

# =============================================================================
# TIER 2: LAYER GUARANTEES
# =============================================================================

  # ---------------------------------------------------------------------------
  # B-TREE LAYER
  # ---------------------------------------------------------------------------
  
  - annotation:
      type: invariant
      tag: btree.structural_integrity
      text: "B-tree operations preserve structural integrity"
      description: |
        All B-tree modifications (insert, delete, balance) maintain:
        - No cells are lost
        - No cells are duplicated  
        - Sort order is preserved
        - Parent-child relationships remain consistent
      components:
        - btree.balance_no_lost_nodes
        - btree.balance_no_duplicates
        - btree.balance_sort_order
        - btree.overflow_consistency
        - btree.freelist_safety
      location:
        file: core/storage/btree.rs
    status: verified

  - annotation:
      type: ensures
      tag: btree.balance_no_lost_nodes
      text: "B-tree balancing never loses cells"
      description: |
        During balance_non_root, all cells from sibling pages are collected
        into CellArray, then redistributed. The collection phase gathers ALL
        cells; the distribution phase writes ALL cells to new locations.
      formal: "|cells_before| == |cells_after|"
      evidence:
        - "Collection phase iterates all siblings left-to-right (btree.rs:3045-3141)"
        - "cell_payloads Vec collects every cell"
        - "Distribution uses prefix sums for disjoint assignment (btree.rs:3763-3806)"
        - "FreePages state runs AFTER distribution (btree.rs:3889-3918)"
      location:
        file: core/storage/btree.rs
        functions:
          - balance_non_root
          - collect_cells
          - distribute_cells
    status: verified
    proof_id: btree-balance-no-nodes-lost

  - annotation:
      type: ensures
      tag: btree.balance_no_duplicates
      text: "B-tree balancing never duplicates cells"
      description: |
        Prefix sums create mathematically disjoint index ranges.
        Page i receives cells [cumsum[i-1], cumsum[i]), guaranteeing
        no cell is assigned to multiple pages.
      formal: "forall i,j: i != j => cells(page_i) ∩ cells(page_j) = {}"
      evidence:
        - "cell_count_per_page_cumulative stores cumulative counts"
        - "Each page gets exclusive range via prefix sum difference"
        - "post_balance_non_root_validation verifies in debug builds"
      location:
        file: core/storage/btree.rs
        functions:
          - balance_non_root
          - edit_page
    status: verified
    proof_id: btree-balance-no-duplicates

  - annotation:
      type: ensures
      tag: btree.balance_sort_order
      text: "B-tree balancing preserves sort order"
      description: |
        Collection iterates pages left-to-right, cells in index order,
        with divider cells interleaved. This preserves the B-tree
        ordering invariant throughout rebalancing.
      formal: "forall i < j: key(cell_i) <= key(cell_j)"
      evidence:
        - "Left-to-right page iteration (btree.rs:3045-3141)"
        - "In-order cell collection within each page"
        - "Divider cells appended after each sibling's cells"
      location:
        file: core/storage/btree.rs
    status: verified
    proof_id: btree-balance-sort-order-preserved

  - annotation:
      type: ensures
      tag: btree.overflow_consistency
      text: "Overflow page chains remain consistent through operations"
      description: |
        Large values spanning multiple overflow pages maintain chain
        integrity. Balance copies raw cell bytes including overflow
        pointer (chain untouched). Delete follows and frees entire chain.
      formal: |
        balance: overflow_chain(cell) unchanged
        delete: all pages in overflow_chain freed
        read: reconstructs original value by following chain
      evidence:
        - "cell_get_raw_region returns local_size + 4 bytes (includes pointer)"
        - "fill_cell_payload links pages via next pointer"
        - "clear_overflow_pages follows chain until next == 0"
      location:
        file: core/storage/btree.rs
        related_files:
          - core/vdbe/payload.rs
    status: verified
    proof_id: overflow-page-consistency

  - annotation:
      type: ensures
      tag: btree.freelist_safety
      text: "Freed pages are safe and not prematurely reused"
      description: |
        Pages are added to freelist only AFTER parent pointers are
        updated (preventing dangling references). Pages are zeroed
        on allocation (preventing stale data leakage).
      formal: |
        free_page: parent_pointers_updated BEFORE freelist_add
        allocate_page: page_content = zeros
      evidence:
        - "NonRootDoBalancingFinish updates parent BEFORE FreePages state"
        - "allocate_page zeroes trunk and leaf pages (pager.rs:4527, 4561)"
        - "Relies on transaction atomicity for crash safety"
      location:
        file: core/storage/pager.rs
        functions:
          - free_page
          - allocate_page
    status: verified
    proof_id: freelist-safety

  # ---------------------------------------------------------------------------
  # PAGE CACHE LAYER
  # ---------------------------------------------------------------------------

  - annotation:
      type: invariant
      tag: cache.consistency
      text: "Page cache maintains consistency with WAL and disk"
      description: |
        The page cache provides a consistent view of pages:
        - Returns most recent version within visibility window
        - Never holds duplicate entries for same page
        - Respects WAL protocol (dirty pages to WAL first)
      components:
        - cache.read_consistency
        - cache.no_duplicates
        - cache.wal_protocol
      location:
        file: core/storage/page_cache.rs
    status: verified

  - annotation:
      type: ensures
      tag: cache.read_consistency
      text: "Reading a page returns the most recently written version"
      description: |
        Within a transaction's visibility window (bounded by max_frame
        at begin_read_tx), reading returns the latest committed version.
        Cache hit returns same Arc<Page>; cache miss consults WAL then disk.
      formal: "read(page_id) == latest_committed_version(page_id, max_frame)"
      evidence:
        - "Cache hit returns same Arc<Page> with current state"
        - "Cache miss: find_frame(page_id, max_frame) returns latest WAL frame"
        - "Fallback to disk if no WAL frame exists"
      location:
        file: core/storage/pager.rs
        functions:
          - read_page
          - read_page_no_cache
    status: verified
    proof_id: page-cache-read-consistency

  - annotation:
      type: ensures
      tag: cache.no_duplicates
      text: "At most one cache entry per page number"
      description: |
        HashMap<PageCacheKey, PageRef> enforces uniqueness by definition.
        Insert logic checks for existing keys before adding.
      formal: "forall p: |cache.entries(page_id=p)| <= 1"
      evidence:
        - "HashMap enforces single value per key"
        - "Insert handles existing keys (page_cache.rs:223-251)"
      location:
        file: core/storage/page_cache.rs
    status: verified
    proof_id: page-cache-no-duplicates

  - annotation:
      type: ensures
      tag: cache.wal_protocol
      text: "Dirty pages are written to WAL before database file"
      description: |
        Modified pages go to WAL only during commit, never directly
        to the database file. Only checkpoint writes committed WAL
        frames to the database.
      formal: |
        commit: dirty_pages -> WAL (never direct to DB)
        checkpoint: WAL_frames[committed] -> DB
      evidence:
        - "commit_dirty_pages_inner writes to WAL only (pager.rs:3486-3736)"
        - "Only checkpoint calls write_pages_vectored to DB"
        - "Checkpoint only writes frames in [nbackfills+1, max_safe_frame]"
      location:
        files:
          - core/storage/pager.rs
          - core/storage/wal.rs
    status: verified
    proof_id: wal-protocol-respected

  # ---------------------------------------------------------------------------
  # DIRTY PAGE TRACKING
  # ---------------------------------------------------------------------------

  - annotation:
      type: ensures
      tag: dirty.tracking_completeness
      text: "Every modified page is tracked before commit"
      description: |
        All modifications flow through add_dirty(), which atomically
        inserts into dirty_pages bitmap AND sets the page's dirty flag.
        Commit iterates this bitmap as authoritative source.
      formal: "modified(page) => page in dirty_pages"
      evidence:
        - "Single entry point: add_dirty() (pager.rs:2917-2934)"
        - "All btree modifications call add_dirty before changes"
        - "HeaderRefMut::from_pager calls add_dirty immediately"
      location:
        file: core/storage/pager.rs
        functions:
          - add_dirty
    status: verified
    proof_id: dirty-page-tracking-completeness

  # ---------------------------------------------------------------------------
  # WAL LAYER
  # ---------------------------------------------------------------------------

  - annotation:
      type: invariant
      tag: wal.durability
      text: "WAL provides atomic, durable commits"
      description: |
        The Write-Ahead Log ensures:
        - All dirty pages written to WAL before commit returns
        - Commit frame marks transaction boundary
        - Checksum chain detects corruption
        - Recovery replays only committed transactions
      components:
        - wal.commit_completeness
        - wal.transaction_atomicity
        - wal.checksum_integrity
        - wal.recovery_correctness
      location:
        file: core/storage/wal.rs
    status: verified

  - annotation:
      type: ensures
      tag: wal.commit_completeness
      text: "Every dirty page is written to WAL during commit"
      description: |
        The commit pipeline processes ALL dirty pages without filtering:
        ScanAndIssueReads -> PrepareFrames -> WaitWrites -> WaitSync.
        Count equality: |dirty_pages| == |page_sources| == |frames|.
      formal: "|dirty_pages| == |WAL_frames_written|"
      evidence:
        - "ScanAndIssueReads iterates ALL dirty_pages (pager.rs:3539)"
        - "PrepareFrames processes ALL page_sources"
        - "evictable() protects dirty pages from eviction"
      location:
        file: core/storage/pager.rs
    status: verified
    proof_id: wal-commit-completeness

  - annotation:
      type: ensures
      tag: wal.transaction_atomicity
      text: "All-or-nothing transaction visibility"
      description: |
        Only the last frame of a transaction has db_size > 0 (commit marker).
        max_frame advances only after fsync. Readers see either all frames
        of a commit or none.
      formal: |
        commit_frame: db_size > 0 only on last frame
        visibility: atomic update of max_frame after fsync
        recovery: discard frames after last_valid_frame
      evidence:
        - "prepare_collected_frames: only last frame gets db_size (wal.rs:2002-2008)"
        - "commit_prepared_frames: max_frame update after sync (wal.rs:2045-2046)"
        - "Recovery: frames.retain(|f| f <= last_valid_frame)"
      location:
        file: core/storage/wal.rs
    status: verified
    proof_id: transaction-atomicity

  - annotation:
      type: ensures
      tag: wal.checksum_integrity
      text: "Checksum chain detects any WAL corruption"
      description: |
        Each frame's checksum is computed from frame content + previous
        frame's checksum. Any bit flip, truncation, or insertion breaks
        the chain. Salt validation prevents stale frame acceptance.
      formal: |
        checksum(frame_n) = f(frame_n.data, checksum(frame_{n-1}))
        corruption => checksum_mismatch => recovery_stops
      evidence:
        - "checksum_wal chains (s0, s1) through frames"
        - "Salt in frame must match WAL header salt"
        - "process_frames stops on first mismatch"
      location:
        file: core/storage/sqlite3_ondisk.rs
        functions:
          - checksum_wal
          - process_frames
    status: verified
    proof_id: wal-checksum-chain-integrity

  - annotation:
      type: ensures
      tag: wal.recovery_correctness
      text: "Recovery restores exactly the committed state"
      description: |
        WAL replay processes frames sequentially, validating checksums.
        Only frames up to last commit (db_size > 0) are made visible.
        Uncommitted frames are discarded.
      formal: |
        after_recovery: visible_state == last_committed_state
        uncommitted_frames: discarded
      evidence:
        - "process_frames tracks last_valid_frame on commit markers"
        - "flush_pending_frames filters to <= last_valid_frame"
        - "finalize_loading sets max_frame = last_valid_frame"
      location:
        file: core/storage/sqlite3_ondisk.rs
    status: verified
    proof_id: wal-recovery-correctness

  # ---------------------------------------------------------------------------
  # CHECKPOINT LAYER
  # ---------------------------------------------------------------------------

  - annotation:
      type: ensures
      tag: checkpoint.data_integrity
      text: "Checkpoint writes correct data to correct locations"
      description: |
        Checkpoint copies committed WAL frames to database file at
        correct offsets. DB is synced before WAL truncation.
        nbackfills updated only after writes complete.
      formal: |
        offset(page_id) = (page_id - 1) * page_size
        write_order: frames -> sync_db -> truncate_wal
        nbackfills updated AFTER writes
      evidence:
        - "Offset calculation in write_pages_vectored"
        - "Debug assertion verifies cache matches WAL content"
        - "DetermineResult state updates nbackfills after writes"
      location:
        file: core/storage/wal.rs
        functions:
          - checkpoint state machine
    status: verified
    proof_id: checkpoint-data-integrity

  # ---------------------------------------------------------------------------
  # HEADER CONSISTENCY
  # ---------------------------------------------------------------------------

  - annotation:
      type: ensures
      tag: header.consistency
      text: "Database header always reflects valid committed state"
      description: |
        Header fields (database_size, freelist_trunk_page, freelist_pages)
        are modified through HeaderRefMut which immediately marks page 1
        dirty. Header changes commit atomically with data changes.
      formal: |
        header_modification => page_1 in dirty_pages
        commit: header + data pages in same commit frame
        recovery: header from same commit as data
      evidence:
        - "HeaderRefMut::from_pager calls add_dirty (pager.rs:95)"
        - "All dirty pages in same commit batch"
        - "find_frame returns latest committed page 1"
      location:
        file: core/storage/pager.rs
    status: verified
    proof_id: database-header-consistency

  # ---------------------------------------------------------------------------
  # RECORD LAYER
  # ---------------------------------------------------------------------------

  - annotation:
      type: ensures
      tag: record.serialization_bijection
      text: "Record serialization is perfectly reversible"
      description: |
        SQLite record format encoding is bijective. Serialize then
        deserialize produces the original value for all types:
        NULL, integers, floats, text, blobs.
      formal: "deserialize(serialize(v)) == v for all v"
      evidence:
        - "Serial types encode both type and size"
        - "Integer ranges map to specific serial types"
        - "Sign extension correctly reconstructs negative I24/I48"
        - "IEEE 754 guarantees float round-trip"
      location:
        file: core/vdbe/record.rs
    status: verified
    proof_id: record-serialization-bijection

# =============================================================================
# TIER 4: COMPOSITION RULES
# =============================================================================

  - annotation:
      type: composition
      tag: durability.composition
      text: "Component guarantees compose to achieve durability"
      description: |
        The durability guarantee is achieved by composing layer guarantees:
        
        1. User data is correctly serialized (record.serialization_bijection)
        2. B-tree operations preserve data (btree.structural_integrity)
        3. All modifications are tracked (dirty.tracking_completeness)
        4. All dirty pages reach WAL (wal.commit_completeness)
        5. Commits are atomic (wal.transaction_atomicity)
        6. Checksums detect corruption (wal.checksum_integrity)
        7. Checkpoint preserves data (checkpoint.data_integrity)
        8. Recovery restores committed state (wal.recovery_correctness)
        9. Header stays consistent (header.consistency)
      composes:
        - record.serialization_bijection
        - btree.balance_no_lost_nodes
        - btree.balance_no_duplicates
        - btree.balance_sort_order
        - btree.overflow_consistency
        - btree.freelist_safety
        - cache.read_consistency
        - cache.no_duplicates
        - cache.wal_protocol
        - dirty.tracking_completeness
        - wal.commit_completeness
        - wal.transaction_atomicity
        - wal.checksum_integrity
        - wal.recovery_correctness
        - checkpoint.data_integrity
        - header.consistency
      achieves: durability.no_committed_data_lost
      data_flow: |
        User Data
            │
            ▼
        ┌─────────────────┐
        │ Record Encoding │ ← record.serialization_bijection
        │   (serialize)   │
        └────────┬────────┘
                 │
                 ▼
        ┌─────────────────┐
        │    B-tree       │ ← btree.* (structural integrity)
        │  (pages/cells)  │
        └────────┬────────┘
                 │
                 ▼
        ┌─────────────────┐
        │   Page Cache    │ ← cache.* (consistency)
        │  (dirty pages)  │
        └────────┬────────┘
                 │
                 ▼
        ┌─────────────────┐
        │  Dirty Tracking │ ← dirty.tracking_completeness
        │    (bitmap)     │
        └────────┬────────┘
                 │
                 ▼
        ┌─────────────────┐
        │      WAL        │ ← wal.* (durability)
        │   (frames)      │
        └────────┬────────┘
                 │
                 ▼
        ┌─────────────────┐
        │   Checkpoint    │ ← checkpoint.data_integrity
        │  (to DB file)   │
        └────────┬────────┘
                 │
                 ▼
        ┌─────────────────┐
        │    Recovery     │ ← wal.recovery_correctness
        │  (WAL replay)   │
        └─────────────────┘
    status: verified

# =============================================================================
# NEGATIVE SPECIFICATIONS (What Must NEVER Happen)
# =============================================================================

  - annotation:
      type: never
      tag: durability.never_lose_committed
      text: "NEVER lose committed data"
      category: data_loss
      rationale: "Core durability guarantee - violating this breaks database integrity"
      target: all_commit_paths
      violation_examples:
        - code: "Skip dirty page during commit iteration"
          problem: "Page modification lost"
        - code: "Write to DB file bypassing WAL"
          problem: "Crash loses data not in WAL"
        - code: "Advance max_frame before fsync"
          problem: "Readers see uncommitted data that may be lost"
    status: verified

  - annotation:
      type: never
      tag: durability.never_partial_transaction
      text: "NEVER make partial transaction visible"
      category: state_corruption
      rationale: "Atomicity requires all-or-nothing semantics"
      target: transaction_commit
      violation_examples:
        - code: "Set commit marker on non-last frame"
          problem: "Partial transaction visible on crash"
        - code: "Update max_frame incrementally per frame"
          problem: "Readers see partial transaction"
    status: verified

  - annotation:
      type: never
      tag: durability.never_corrupt_checksum
      text: "NEVER accept frame with invalid checksum"
      category: silent_failure
      rationale: "Checksum validates WAL integrity - accepting bad frames corrupts data"
      target: wal_recovery
      violation_examples:
        - code: "Skip checksum validation during recovery"
          problem: "Corrupted data accepted as valid"
        - code: "Continue past checksum mismatch"
          problem: "May include corrupted frames in recovery"
    status: verified

  - annotation:
      type: never
      tag: durability.never_orphan_overflow
      text: "NEVER leave overflow pages unreachable"
      category: resource_leak
      rationale: "Orphaned overflow pages waste space and may cause corruption on reuse"
      target: btree_operations
      violation_examples:
        - code: "Delete cell without following overflow chain"
          problem: "Overflow pages leaked, space wasted"
        - code: "Balance copies cell without overflow pointer"
          problem: "Overflow chain becomes unreachable"
    status: verified

  - annotation:
      type: never
      tag: durability.never_reuse_active_page
      text: "NEVER allocate a page still referenced by B-tree"
      category: state_corruption
      rationale: "Reusing active page overwrites live data"
      target: freelist_allocate
      violation_examples:
        - code: "Add page to freelist before updating parent"
          problem: "Page reused while still referenced"
        - code: "Free page without removing from parent"
          problem: "Parent points to freed page"
    status: verified

